[package]
name = "hakimi-plugin"
version = "0.1.0"
edition = "2021"
authors = ["Hakimi Team"]
description = "Plugin system for Hakimi Agent"
license = "MIT"

[features]
default = []
wasm = ["wasmtime", "wasmtime-wasi"]

[dependencies]
hakimi-common = { path = "../hakimi-common" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
dirs = "5.0"
libloading = "0.8"
reqwest = { workspace = true, features = ["blocking"] }
notify = "6.0"
sha2 = "0.10"
base64 = { workspace = true }
ring = { workspace = true }
anyhow = "1.0"
chrono = "0.4"

# WASM runtime (optional feature)
# Omit default `cache` (pulls zstd 0.13 / RUSTSEC-2026-0391,0398,0403; no 36.x bump exists).
wasmtime = { version = "36.0.20", optional = true, default-features = false, features = [
    "async",
    "cranelift",
    "runtime",
    "std",
    "wat",
    "parallel-compilation",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "gc",
    "gc-drc",
    "gc-null",
    "component-model",
] }
wasmtime-wasi = { version = "36.0.20", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
tracing-subscriber = "0.3"
