# TEMPORARY diagnostic workflow.
#
# `cargo fmt --all -- --check` is failing in CI, and Actions job logs are not
# readable without an authenticated token. This publishes the rustfmt diff to a
# dedicated branch so it can be fetched over plain HTTPS, then acted on.
#
# It never writes to main: it only force-pushes a single file to `ci/fmt-diff`.
# Delete this file once the formatting is fixed.
name: Fmt Diff

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fmt-diff:
    name: Publish rustfmt diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match the toolchain ci.yml checks with, or the diff is meaningless.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-24
          components: rustfmt

      - name: Capture rustfmt diff
        run: |
          set +e
          cargo fmt --all -- --check > fmt-diff.txt 2>&1
          echo "exit=$?" >> fmt-diff.txt
          rustfmt --version >> fmt-diff.txt
          wc -l fmt-diff.txt

      - name: Publish to ci/fmt-diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-fmt-diff
          git rm -rf --cached . > /dev/null
          git add -f fmt-diff.txt
          git commit -m "chore: rustfmt diff for ${GITHUB_SHA}"
          git push -f origin ci-fmt-diff:ci/fmt-diff
