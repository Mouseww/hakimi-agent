name: Deploy API Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      
      - name: Build documentation
        # Do not use --all-features here: hakimi-desktop's optional GUI feature pulls
        # Tauri/WebKit/GTK system libraries that are not installed on ubuntu-latest.
        # Desktop GUI release builds are covered by the release workflow instead.
        run: cargo doc --workspace --no-deps --exclude hakimi-desktop
        
      - name: Add index redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=hakimi_agent/index.html">' > target/doc/index.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
